  <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="portfolio-container">
        <!-- Cabeçalho do Portfólio -->
        <header class="portfolio-header">
            <h1>Portfolio</h1>
            <p>Exemplos de projetos</p>
        </header>

        <!-- Menu de Categorias / Filtros -->
        <nav class="portfolio-filters">
            <button class="filter-btn">All</button>
            <button class="filter-btn">Web Apps</button>
            <button class="filter-btn">Loja Online</button>
            <button class="filter-btn">UI Components</button>
        </nav>

        <!-- Grid de Projetos -->
        <section class="portfolio-grid">
            
            <!-- Card 1 - TaskManager -->
            <article class="portfolio-item">
                <img src="taskmanager.jpeg" alt="Interface do TaskManager" class="portfolio-image">
                <h3>Gerenciador de Tarefas</h3>
                <span>Web Apps</span>
            </article>

            <!-- Card 2 - CineView -->
            <article class="portfolio-item">
                <img src="cineview.jpeg" alt="Interface do CineView" class="portfolio-image">
                <h3>Catalogo de Filmes</h3>
                <span>Web Apps</span>
            </article>

            <!-- Card 3 - DevSpace Login -->
            <article class="portfolio-item">
                <img src="devspace.jpeg" alt="Tela de login do DevSpace" class="portfolio-image">
                <h3>Pagina de Login</h3>
                <span>UI Components</span>
            </article>

            <!-- Card 4 - ClimaNow -->
            <article class="portfolio-item">
                <img src="climanow.jpeg" alt="Interface do ClimaNow" class="portfolio-image">
                <h3>Previsão do Tempo</h3>
                <span>Web Apps</span>
            </article>

            <!-- Card 5 - Store -->
            <article class="portfolio-item">
                <img src="store.jpeg" alt="Página de produto da Store" class="portfolio-image">
                <h3>Loja Online</h3>
                <span>Loja Online</span>
            </article>

            <!-- Card 6 - FinanceFlow Dashboard -->
            <article class="portfolio-item">
                <img src="financeflow.jpeg" alt="Dashboard do FinanceFlow" class="portfolio-image">
                <h3>Dashboard Financeiro</h3>
                <span>Web Apps</span>
            </article>

        </section>
    </div>

</body>
</html>
